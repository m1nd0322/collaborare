name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - run: npm test

  windows-deployment:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.2
      - name: Verify committed deployment payload
        shell: powershell
        run: |
          .\scripts\Test-VsixArtifact.ps1 `
            -VsixPath ".\dist\collaborare-0.1.1.vsix"
          .\scripts\New-DeploymentManifest.ps1 `
            -ExpectedCollaborareVersion "0.1.1" `
            -ExpectedNodeVersion "22.23.2" `
            -Verify
          .\test\powershell\deployment-smoke.ps1
      - name: Rebuild and verify VSIX source payload
        shell: powershell
        run: |
          $nodeVersion = (node --version).Trim().TrimStart("v")
          .\scripts\Package-Extension.ps1 `
            -ExpectedNodeVersion $nodeVersion
